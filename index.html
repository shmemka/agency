<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Сверка: кабинет агентства для рекламы у блогеров" />
    <meta property="og:title" content="Сверка" />
    <meta property="og:description" content="Кабинет агентства: блогеры, кампании, подборки и отчёты для клиентов" />
    <meta property="og:type" content="website" />
    <title>Сверка</title>
    <!-- до загрузки скрипта: фон сайта вместо белого экрана, а у вошедших — каркас кабинета -->
    <style>
      html, body { margin: 0; background: #eef0f4; }
      #boot { display: none; min-height: 100vh; }
      #boot .s { background: rgb(21 23 28 / 0.06); border-radius: 999px; }
      #boot aside { width: 240px; padding: 20px 24px; box-sizing: border-box; }
      #boot .m { width: 32px; height: 32px; border-radius: 50%; background: #15171c; margin-bottom: 30px; }
      #boot aside .s { height: 12px; margin: 0 0 24px 2px; }
      #boot main { flex: 1; padding: 32px 24px; }
      @media (max-width: 767px) { #boot aside { display: none; } #boot main { padding: 64px 16px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <aside>
          <div class="m"></div>
          <div class="s" style="width: 64px"></div><div class="s" style="width: 76px"></div><div class="s" style="width: 88px"></div>
          <div class="s" style="width: 72px"></div><div class="s" style="width: 60px"></div><div class="s" style="width: 80px"></div>
        </aside>
        <main>
          <div class="s" style="height: 32px; width: 224px"></div>
          <div class="s" style="height: 14px; width: 288px; max-width: 100%; margin-top: 12px"></div>
        </main>
      </div>
    </div>
    <script>
      try {
        if (!/\/(s|o|join)\/?$/.test(location.pathname) && Object.keys(localStorage).some((k) => /^sb-.+-auth-token$/.test(k))) document.getElementById('boot').style.display = 'flex'
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
